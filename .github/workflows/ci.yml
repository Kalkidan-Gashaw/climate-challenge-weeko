 ```yaml
            name: CI Checks

            on:
              push:
                branches:
                  - main # This workflow will run on pushes to the 'main' branch

            jobs:
              build:
                runs-on: ubuntu-latest

                steps:
                - uses: actions/checkout@v4 # Checks out your repository
                - name: Set up Python
                  uses: actions/setup-python@v5
                  with:
                    python-version: '3.9' # Or your preferred Python version

                - name: Install dependencies
                  run: |
                    python -m pip install --upgrade pip
                    pip install -r requirements.txt

                # Optional: Add a simple test to verify python is working
                - name: Verify Python version
                  run: python --version
            ```